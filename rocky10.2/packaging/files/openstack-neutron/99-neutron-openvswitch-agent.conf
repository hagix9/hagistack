# Written for Hagistack.
# Netfilter for bridged traffic, needed by the iptables-based security group
# drivers of the Open vSwitch agent. The keys exist only once br_netfilter is
# loaded; the leading "-" makes a missing key a silent no-op (sysctl.d(5)).
-net.bridge.bridge-nf-call-arptables = 1
-net.bridge.bridge-nf-call-iptables = 1
-net.bridge.bridge-nf-call-ip6tables = 1
