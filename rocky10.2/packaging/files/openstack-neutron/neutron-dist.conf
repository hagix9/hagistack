# Distribution defaults for OpenStack Networking (Neutron), written for
# Hagistack. Installed as /usr/share/neutron/neutron-dist.conf and passed as
# the FIRST --config-file by every Neutron unit, so any value set in
# /etc/neutron/*.conf, *.ini or conf.d/ overrides it. Do not edit this file;
# set the option in /etc/neutron instead. The API under httpd does not read it.

[AGENT]
# Upstream's default root helper is plain "sudo", which the neutron sudoers
# rule does not allow; commands run as root go through rootwrap and its
# filters instead.
root_helper = sudo neutron-rootwrap /etc/neutron/rootwrap.conf
root_helper_daemon = sudo neutron-rootwrap-daemon /etc/neutron/rootwrap.conf

[oslo_concurrency]
# The iptables and ipset managers take inter-process locks, which fail when
# no lock_path is set (upstream has no default). state_path defaults to
# /var/lib/neutron, which belongs to the neutron user.
lock_path = $state_path/lock
