# Written for Hagistack. Installed as /etc/httpd/conf.d/openstack-dashboard.conf
# and active as soon as it is installed (EL loads every conf.d/*.conf).
#
# The OpenStack dashboard (Horizon) under /dashboard on the server's default
# host. The URL path must match WEBROOT in /etc/openstack-dashboard/local_settings.
# The static files are the tree `manage.py collectstatic` writes
# (STATIC_ROOT = /usr/share/openstack-dashboard/static, STATIC_URL =
# WEBROOT + 'static/').

# Own mod_wsgi daemon processes running as apache, which can read
# /etc/openstack-dashboard. Kept out of the processes of the other WSGI
# applications on this httpd.
WSGIDaemonProcess openstack-dashboard user=apache group=apache processes=3 threads=10 display-name=%{GROUP}

# Static files first, so the more specific URL is matched before the WSGI alias.
Alias /dashboard/static /usr/share/openstack-dashboard/static

# process-group and application-group are given here rather than with
# WSGIProcessGroup/WSGIApplicationGroup at server level, so they apply to this
# application only. %{GLOBAL}: the main interpreter, as some C extensions need.
WSGIScriptAlias /dashboard /usr/share/openstack-dashboard/openstack_dashboard/wsgi.py process-group=openstack-dashboard application-group=%{GLOBAL}

<Directory /usr/share/openstack-dashboard/openstack_dashboard>
  Options None
  AllowOverride None
  <Files wsgi.py>
    Require all granted
  </Files>
</Directory>

<Directory /usr/share/openstack-dashboard/static>
  Options None
  AllowOverride None
  Require all granted
</Directory>
