# Written for Hagistack. An EXAMPLE, installed as documentation only; nothing
# loads it.
#
# By default the dashboard logs through httpd: its Python logging goes to
# stderr (the LOGGING console handlers in local_settings), which mod_wsgi
# writes to httpd's error log, and its requests appear in httpd's access log.
#
# To keep the dashboard's logs apart in /var/log/horizon (owned by apache,
# rotated by /etc/logrotate.d/openstack-dashboard), serve the dashboard from a
# virtual host of its own with its own log files. Copy the directives of
# /etc/httpd/conf.d/openstack-dashboard.conf that start with Alias,
# WSGIScriptAlias and <Directory> into it (WSGIDaemonProcess may stay at server
# level) and adjust the host name:
#
# <VirtualHost *:80>
#   ServerName dashboard.example.com
#   ErrorLog /var/log/horizon/horizon_error.log
#   CustomLog /var/log/horizon/horizon_access.log combined
#   # ... the dashboard's Alias, WSGIScriptAlias and <Directory> blocks ...
# </VirtualHost>
