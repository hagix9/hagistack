# Written for Hagistack. Installed as
# /usr/lib/systemd/system/httpd.service.d/openstack-dashboard.conf.
#
# Rebuild the dashboard's static assets before httpd starts, so they always
# match the installed packages and /etc/openstack-dashboard/local_settings:
#   collectstatic   copies the static files of Horizon, the dashboard, the
#                   themes and the python3-XStatic-* packages into
#                   /usr/share/openstack-dashboard/static;
#   compress        writes the offline compression output and its manifest
#                   (COMPRESS_OFFLINE = True in local_settings); --force also
#                   works when an administrator turned COMPRESS_OFFLINE off.
# Both write under /usr/share/openstack-dashboard. httpd.service sets
# ProtectSystem, so the unit needs ReadWritePaths=/usr/share/openstack-dashboard;
# the Hagistack installer adds it in /etc/systemd/system/httpd.service.d/.
#
# The leading "-" lets httpd start even if a step fails: this httpd may also
# serve other OpenStack APIs, and a dashboard asset problem must not take them
# down. The dashboard then shows the failure itself.
[Service]
ExecStartPre=-/usr/bin/python3 /usr/share/openstack-dashboard/manage.py collectstatic --noinput
ExecStartPre=-/usr/bin/python3 /usr/share/openstack-dashboard/manage.py compress --force
# The two steps take about a minute; leave room beyond the default start timeout.
TimeoutStartSec=300
