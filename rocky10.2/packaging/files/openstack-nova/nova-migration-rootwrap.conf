# oslo.rootwrap configuration for the nova_migration account, written for
# Hagistack. Used only as
#   sudo /usr/bin/nova-rootwrap /etc/nova/migration/rootwrap.conf runuser -u nova -- ...
# by /usr/bin/nova-migration-wrapper (see /etc/sudoers.d/nova_migration).
# Option meanings: the oslo.rootwrap documentation.
[DEFAULT]
# Only the cold-migration filters; this directory must be writable by root only.
filters_path=/etc/nova/migration/rootwrap.d
# Commands are only looked up in these directories (runuser lives in one of them).
exec_dirs=/usr/sbin,/usr/bin
# Every accepted and refused command is logged.
use_syslog=True
syslog_log_facility=authpriv
syslog_log_level=INFO
