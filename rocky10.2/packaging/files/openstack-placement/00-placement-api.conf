# Written for Hagistack.
# The Placement API under Apache httpd and mod_wsgi. OpenStack 2026.1 no longer
# builds a placement-api script, so mod_wsgi loads the application module
# placement/wsgi/api.py from the Python site-packages directory. The package
# build replaces __PYTHON3_SITELIB__ with that directory.
Listen 8778

<VirtualHost *:8778>
  WSGIDaemonProcess placement-api processes=3 threads=1 user=placement group=placement display-name=%{GROUP}
  WSGIProcessGroup placement-api
  WSGIScriptAlias / __PYTHON3_SITELIB__/placement/wsgi/api.py
  WSGIApplicationGroup %{GLOBAL}
  WSGIPassAuthorization On
  <Directory __PYTHON3_SITELIB__/placement/wsgi>
    Require all granted
  </Directory>
  # httpd's own log directory: httpd may write there under SELinux, and the
  # httpd package rotates it.
  ErrorLog /var/log/httpd/placement_error.log
  CustomLog /var/log/httpd/placement_access.log combined
</VirtualHost>
