# oslo.rootwrap configuration for Glance, written for Hagistack.
# Used through sudo by /usr/bin/glance-rootwrap (see /etc/sudoers.d/glance)
# when a store driver, such as the cinder store through os-brick, needs to run
# a command as root. Option meanings: the oslo.rootwrap documentation.
[DEFAULT]
# Filter definitions; /etc/glance/rootwrap.d holds links to the filter files
# that glance_store and os-brick install.
filters_path=/etc/glance/rootwrap.d
# Commands are only looked up in these directories.
exec_dirs=/usr/sbin,/usr/bin,/sbin,/bin
use_syslog=False
