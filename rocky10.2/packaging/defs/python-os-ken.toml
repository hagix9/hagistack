# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python-os-ken"
project = "os-ken"
version = "4.1.2"
release = "3"
# Stage 6-5-R1: rebuilt with the change notice (and Hagistack doc logos where docs are built).
changelog_date = "Sun Nov 15 2026"
# Hagistack's changes to installed files (written into %changelog and
# HAGISTACK-CHANGES by genspec.py).
changes = [
  "os_ken/tests/mininet/run_mnet-test.sh (in python3-os-ken): rpm's build policy (brp-mangle-shebangs) rewrites its shebang #!/bin/sh to #!/usr/bin/sh.",
]
# Changed files that are installed and have # comments: genspec.py puts a
# comment line into each (after a #! line), saying that it is changed.
mark_files = [
  { path = "os_ken/tests/mininet/run_mnet-test.sh" },
]
tarball = "os_ken-4.1.2.tar.gz"
sha256 = "0a335e02ea3de4842026dafde752b1dd4d99568f957b1f97c2c1d31f8e9d911f"
signing_key = "0x30566c450e41d7c91e442dfb231f942f608ddeff"
license = "Apache-2.0"
summary = "A component-based software defined networking framework for OpenStack."
description = """
A component-based software defined networking framework for OpenStack.

The upstream os-ken 4.1.2 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)"]

drop_after_install = ["%{_prefix}/etc"]
[[package]]
name = "python3-os-ken"
kind = "python"
modules = ["os_ken"]
licenses = ["LICENSE"]
dirs = [{ path = "%{_sysconfdir}/os_ken" }]
install = [{ src = "upstream:etc/os_ken/os_ken.conf", dest = "%{_sysconfdir}/os_ken/os_ken.conf", group = "neutron", config = true }]
# os_ken.lib.ovs uses the ovs module; rc4 required it.
requires = ["python3-openvswitch"]

[[package]]
name = "python-os-ken-doc"
kind = "sphinx-html"
summary = "Documentation for os-ken"
description = """
HTML documentation for os-ken, built from the upstream sources.
"""
docs = ["README.rst"]
licenses = ["LICENSE"]
