# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Names, epoch, modes and owners follow what rc4 published so the new build can
# replace it; every file installed comes either from the upstream tarball, from
# oslo-config-generator run on upstream's generator config, or from
# ../files/openstack-keystone/ (Hagistack's own; see AUTHORING.md there).
# Intended omission: /usr/share/keystone/keystone-dist.conf (nothing reads it at
# run time; the installer writes /etc/keystone/keystone.conf itself).
[source]
name = "openstack-keystone"
project = "keystone"
version = "29.1.0"
release = "1"
epoch = 1
tarball = "keystone-29.1.0.tar.gz"
sha256 = "9090a34976c48b518dec21d73260d3af76029c05bd40bfe2cb097dfd7d343bc1"
signing_key = "0x30566c450e41d7c91e442dfb231f942f608ddeff"
license = "Apache-2.0"
summary = "OpenStack Identity service (Keystone)"
description = """
Keystone provides authentication, authorization and the service catalog for
OpenStack. This package holds the command line tools, configuration and the
service user. This is the upstream OpenStack release, packaged by Hagistack.
"""
check = "import"
# osprofiler is a runtime requirement of keystone (requirements.txt), so it is
# present for the generator's osprofiler namespace; systemd-rpm-macros gives
# %{_tmpfilesdir} and %tmpfiles_create (there is no systemd unit to pull it in).
buildrequires = ["systemd-rpm-macros"]
locale_domain = "keystone"
# The wheel's data-files land under /usr/etc (pyproject.toml data-files:
# etc/sso_callback_template.html); the file is installed explicitly below.
drop_after_install = ["%{_prefix}/etc"]
build_extra = [
'''# Hagistack: a generated file must not carry the build machine's identity.
# Option values equal to the build host's name or one of its IPv4 addresses
# become <current_hostname> / <host_ipv4>; afterwards no option line may
# still contain the name and no line at all an address, or the build stops.
hagistack_scrub() {
    hs_host="$(uname -n)"
    hs_addrs="$( { getent ahostsv4 "$hs_host" 2>/dev/null | awk '{ print $1 }'; %{python3} -c 'import socket; s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.connect(("192.0.2.1", 9)); print(s.getsockname()[0])' 2>/dev/null; } | grep -v '^127\.' | sort -u | tr '\n' ' ')"
    [ "$hs_host" = localhost ] && hs_host=""
    awk -v h="$hs_host" -v a="$hs_addrs" '
        BEGIN { n = split(a, ips, " ") }
        /^#?[A-Za-z0-9_.-]+ = / {
            i = index($0, " = "); k = substr($0, 1, i + 2); v = substr($0, i + 3)
            if (h != "" && v == h) v = "<current_hostname>"
            for (j = 1; j <= n; j++) if (v == ips[j]) v = "<host_ipv4>"
            $0 = k v
        }
        { print }' "$1" > "$1.scrubbed"
    mv "$1.scrubbed" "$1"
    ! awk -v h="$hs_host" -v a="$hs_addrs" '
        BEGIN { n = split(a, ips, " "); bad = 0 }
        /^#?[A-Za-z0-9_.-]+ = / { if (h != "" && index($0, h)) bad = 1 }
        { for (j = 1; j <= n; j++) if (index($0, ips[j])) bad = 1 }
        END { exit !bad }' "$1" || { echo "$1 carries the build host's identity" >&2; exit 1; }
}''',
"# Hagistack: keystone.conf from upstream's generator config (config-generator/keystone.conf).",
"PYTHONPATH=\"$PWD\" oslo-config-generator --config-file config-generator/keystone.conf --output-file etc/keystone.conf.sample",
"# A namespace whose library is missing is silently skipped; require the sections.",
"for s in DEFAULT database cache token fernet_tokens oslo_messaging_rabbit oslo_policy profiler; do grep -q \"^\\[$s\\]\" etc/keystone.conf.sample || exit 1; done",
"hagistack_scrub etc/keystone.conf.sample",
]
install_extra = [
"# Hagistack: the log file is a ghost entry (tmpfiles.d creates it at install time).",
"touch %{buildroot}%{_localstatedir}/log/keystone/keystone.log",
]

[[package]]
name = "openstack-keystone"
kind = "files"
requires = ["python3-keystone = %{epoch}:%{version}-%{release}"]
sysusers = "openstack-keystone.sysusers"
bin = ["keystone-manage", "keystone-status"]
docs = ["README.rst"]
licenses = ["LICENSE"]
dirs = [
  { path = "%{_sysconfdir}/keystone", mode = "0750", group = "keystone" },
  { path = "%{_sysconfdir}/keystone/policy.d", mode = "0750", group = "keystone" },
  { path = "%{_datadir}/keystone" },
  { path = "%{_sharedstatedir}/keystone", mode = "0755", user = "keystone", group = "keystone" },
  { path = "%{_localstatedir}/log/keystone", mode = "0750", user = "keystone", group = "keystone" },
]
install = [
  { src = "upstream:etc/keystone.conf.sample",           dest = "%{_sysconfdir}/keystone/keystone.conf",                mode = "0640", group = "keystone", config = true },
  { src = "upstream:etc/logging.conf.sample",            dest = "%{_sysconfdir}/keystone/logging.conf",                 mode = "0640", group = "keystone", config = true },
  { src = "upstream:etc/sso_callback_template.html",     dest = "%{_sysconfdir}/keystone/sso_callback_template.html",   mode = "0640", user = "keystone", group = "keystone", config = true },
  { src = "upstream:tools/sample_data.sh",               dest = "%{_datadir}/keystone/sample_data.sh",                  mode = "0755" },
  { src = "upstream:httpd/uwsgi-keystone.conf",          dest = "%{_datadir}/keystone/uwsgi-keystone.conf",             mode = "0644", group = "keystone" },
  { src = "file:openstack-keystone-sample-data",         dest = "%{_bindir}/openstack-keystone-sample-data",            mode = "0755" },
  { src = "file:openstack-keystone.logrotate",           dest = "%{_sysconfdir}/logrotate.d/openstack-keystone",        mode = "0644", config = true },
  { src = "file:openstack-keystone.tmpfiles",            dest = "%{_tmpfilesdir}/openstack-keystone.conf",              mode = "0644" },
]
# rc4 listed the log file as %ghost 0660 root:keystone; tmpfiles.d creates it.
files = ["%ghost %attr(0660, root, keystone) %{_localstatedir}/log/keystone/keystone.log"]
scriptlets = { post = ["%tmpfiles_create %{_tmpfilesdir}/openstack-keystone.conf"] }

[[package]]
name = "python3-keystone"
kind = "python"
summary = "Python modules of the OpenStack Identity service"
description = """
The keystone Python package: the Identity API, its backends, the WSGI
application module keystone.wsgi.api and the command implementations.
"""
modules = ["keystone"]
licenses = ["LICENSE"]

[[package]]
name = "python3-keystone+ldap"
kind = "extras"
extras = ["ldap"]

[[package]]
name = "python3-keystone-tests"
kind = "python-tests"
summary = "Unit and functional tests of the OpenStack Identity service"
description = """
The upstream test suite of keystone.
"""
requires = ["python3-keystone = %{epoch}:%{version}-%{release}"]
tests_path = "keystone/tests"
licenses = ["LICENSE"]
