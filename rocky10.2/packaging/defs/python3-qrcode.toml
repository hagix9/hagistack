# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python3-qrcode"
origin = "pypi"
project = "qrcode"
version = "8.2"
release = "2"
tarball = "qrcode-8.2.tar.gz"
sha256 = "35c3f2a4172b33136ab9f6b3ef1c00260dd2f66f858f24d88418a015f446506c"
license = "BSD-3-Clause"
summary = "QR Code image generator"
description = """
QR Code image generator.

The upstream qrcode 8.2 release, packaged by Hagistack.
"""
check = "import"

# Hagistack's changes to the upstream tree: written into %changelog and
# HAGISTACK-CHANGES (installed in every binary package) by genspec.py.
changelog_date = "Fri Nov 13 2026"
changes = [
  "The #!/usr/bin/env python shebang line is removed from the Python modules that have one (they are never run directly, and rpm refuses the ambiguous python shebang).",
]
# Changed files that are installed and have # comments: genspec.py puts a
# comment line into each (after a #! line), saying that it is changed.
mark_files = [
  { path = "qrcode/console_scripts.py" },
]
# rpm refuses the ambiguous "#!/usr/bin/env python" shebang qrcode ships in a module
# that is never run directly; the line is removed rather than rewritten.
prep_extra = ["find . -name '*.py' -exec sed -i '1{/^#![[:space:]]*\\/usr\\/bin\\/env[[:space:]]*python[[:space:]]*$/d}' {} +"]
# The sdist metadata names no licence file (PEP 639); see licenses below.
license_metadata = false
[[package]]
name = "python3-qrcode"
kind = "python"
modules = ["qrcode"]
bin = ["qr"]
licenses = ["LICENSE"]
