# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python-oslo-middleware"
project = "oslo.middleware"
version = "8.0.0"
release = "1"
tarball = "oslo_middleware-8.0.0.tar.gz"
sha256 = "38ca82fcb39736c75e69abcacec5ea9577be9731d73fefb9ea337ca2143b8e7d"
signing_key = "0xb8e9315f48553ec5aff9ffe5e69d97da9efb5aff"
license = "Apache-2.0"
summary = "Oslo Middleware library"
description = """
Oslo Middleware library.

The upstream oslo.middleware 8.0.0 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(oslo-config)", "python3dist(openstackdocstheme)", "python3dist(stevedore)"]
locale_domain = "oslo_middleware"

[[package]]
name = "python3-oslo-middleware"
kind = "python"
modules = ["oslo_middleware"]
docs = ["README.rst"]
licenses = ["LICENSE"]
# The translations (and for oslo.cache its dogpile and etcd3gw backends) install with the library, as in rc4.
requires = ["python-oslo-middleware-lang = %{?epoch:%{epoch}:}%{version}-%{release}"]

[[package]]
name = "python-oslo-middleware-lang"
kind = "lang"
summary = "Translations for oslo.middleware"
description = """
Compiled message catalogues for oslo.middleware.
"""
licenses = ["LICENSE"]

[[package]]
name = "python3-oslo-middleware-tests"
kind = "python-tests"
tests_path = "oslo_middleware/tests"
summary = "Tests for oslo.middleware"
description = """
The upstream test suite of oslo.middleware.
"""

[[package]]
name = "python-oslo-middleware-doc"
kind = "sphinx-html"
summary = "Documentation for oslo.middleware"
description = """
HTML documentation for oslo.middleware, built from the upstream sources.
"""
licenses = ["LICENSE"]
