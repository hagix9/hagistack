[source]
name = "python-oslo-service"
project = "oslo.service"
version = "4.5.1"
release = "1"
tarball = "oslo_service-4.5.1.tar.gz"
sha256 = "959b0c088aa6c4aaea52e19a4583d49f905a505e83120f2f08c9b351ffe9a244"
signing_key = "0xb8e9315f48553ec5aff9ffe5e69d97da9efb5aff"
license = "Apache-2.0"
summary = "oslo.service library"
description = """
oslo.service library.

The upstream oslo.service 4.5.1 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)", "python3dist(oslo-config)"]

[[package]]
name = "python3-oslo-service"
kind = "python"
modules = ["oslo_service"]
docs = ["README.rst"]
licenses = ["LICENSE"]

[[package]]
name = "python3-oslo-service-tests"
kind = "python-tests"
tests_path = "oslo_service/tests"
summary = "Tests for oslo.service"
description = """
The upstream test suite of oslo.service.
"""

[[package]]
name = "python3-oslo-service+threading"
kind = "extras"
extras = ["threading"]

[[package]]
name = "python-oslo-service-doc"
kind = "sphinx-html"
summary = "Documentation for oslo.service"
description = """
HTML documentation for oslo.service, built from the upstream sources.
"""
licenses = ["LICENSE"]
