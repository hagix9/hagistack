# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python-barbicanclient"
project = "python-barbicanclient"
version = "7.3.0"
release = "3"
tarball = "python_barbicanclient-7.3.0.tar.gz"
sha256 = "f3930b7b30bce774c77b85f49dbb36bdce7cb783b3b6c6779244775e4e113da6"
signing_key = "0xb8e9315f48553ec5aff9ffe5e69d97da9efb5aff"
license = "Apache-2.0"
summary = "Client Library for OpenStack Barbican Key Management API"
description = """
Client Library for OpenStack Barbican Key Management API.

The upstream python-barbicanclient 7.3.0 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)", "python3dist(sphinxcontrib-svg2pdfconverter)"]

# Hagistack's changes to the upstream tree: written into %changelog and
# HAGISTACK-CHANGES (installed in every binary package) by genspec.py.
changelog_date = "Sun Nov 15 2026"
changes = [
  "doc/source/conf.py: the Sphinx extension sphinxcontrib.rsvgconverter is removed from the extension list (it is only for PDF output and not available on the builder). The HTML documentation in python-barbicanclient-doc is built from the edited file.",
]
# sphinxcontrib.rsvgconverter is only for PDF output and its module is not in the
# builder repositories; the HTML build does not need it.
prep_extra = ["sed -i \"/'sphinxcontrib.rsvgconverter',/d\" doc/source/conf.py"]
[[package]]
name = "python3-barbicanclient"
kind = "python"
modules = ["barbicanclient"]
bin = ["barbican"]
bin_symlinks = { "barbican-3" = "./barbican" }
docs = ["AUTHORS", "CONTRIBUTING.rst", "ChangeLog", "PKG-INFO", "README.rst"]
licenses = ["LICENSE"]

[[package]]
name = "python-barbicanclient-doc"
kind = "sphinx-html"
summary = "Documentation for python-barbicanclient"
description = """
HTML documentation for python-barbicanclient, built from the upstream sources.
"""
licenses = ["LICENSE"]
