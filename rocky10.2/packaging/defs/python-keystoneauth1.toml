# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python-keystoneauth1"
project = "keystoneauth"
version = "5.13.1"
release = "2"
tarball = "keystoneauth1-5.13.1.tar.gz"
sha256 = "e011e47ac3f3c671ffae33505c095548650cc19dab7f6af3b2ea5bd18c98f0c9"
signing_key = "0xb8e9315f48553ec5aff9ffe5e69d97da9efb5aff"
license = "Apache-2.0"
summary = "Authentication Library for OpenStack Identity"
description = """
Authentication Library for OpenStack Identity.

The upstream keystoneauth 5.13.1 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)", "python3dist(sphinxcontrib-apidoc)"]

# Hagistack's changes to the upstream tree: written into %changelog and
# HAGISTACK-CHANGES (installed in every binary package) by genspec.py.
changelog_date = "Fri Nov 13 2026"
changes = [
  "doc/source/conf.py: the documentation extension ext.list_plugins is removed from the extension list (it fails with the Sphinx on the builder). The HTML documentation in python-keystoneauth1-doc is built from the edited file and lacks the generated plugin list.",
]
# The doc extension ext.list_plugins fails with the Sphinx in the builder
# repositories (report_load_failure() signature); the HTML build runs without it,
# losing only the generated plugin list.
prep_extra = ["sed -i \"/'ext.list_plugins',/d\" doc/source/conf.py"]
[[package]]
name = "python3-keystoneauth1"
kind = "python"
modules = ["keystoneauth1"]
docs = ["README.rst"]
licenses = ["LICENSE"]
# Names rc4 provided.
provides = ["python-keystoneauth = %{?epoch:%{epoch}:}%{version}-%{release}", "python3.12-keystoneauth = %{?epoch:%{epoch}:}%{version}-%{release}"]

[[package]]
name = "python-keystoneauth1-doc"
kind = "sphinx-html"
summary = "Documentation for keystoneauth"
description = """
HTML documentation for keystoneauth, built from the upstream sources.
"""
licenses = ["LICENSE"]
