Oslo Messaging API.

The upstream oslo.messaging 17.3.0 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)", "python3dist(stevedore)", "python3dist(oslo-config)"]

[[package]]
