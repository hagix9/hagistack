tests_path = "oslo_messaging/tests"
summary = "Tests for oslo.messaging"
description = """
The upstream test suite of oslo.messaging.
"""

[[package]]
name = "python-oslo-messaging-doc"
kind = "sphinx-html"
summary = "Documentation for oslo.messaging"
description = """
HTML documentation for oslo.messaging, built from the upstream sources.
"""
