# Hagistack package definition. Facts only: pins, names, files. See ../README.md.
# Drafted by draft-def.py from rc4 RPM metadata and the upstream source; reviewed by hand.
[source]
name = "python-keystonemiddleware"
project = "keystonemiddleware"
version = "12.0.0"
release = "3"
tarball = "keystonemiddleware-12.0.0.tar.gz"
sha256 = "234ff0b5d35541ac1113396339e2d6e26b1f7a1d7867bca223f488073e207cd4"
signing_key = "0xb8e9315f48553ec5aff9ffe5e69d97da9efb5aff"
license = "Apache-2.0"
summary = "Middleware for OpenStack Identity"
description = """
Middleware for OpenStack Identity.

The upstream keystonemiddleware 12.0.0 release, packaged by Hagistack.
"""
doc = "doc/source"
check = "import"
buildrequires = ["python3dist(sphinx)", "python3dist(openstackdocstheme)", "python3dist(oslo-config)", "python3dist(sphinxcontrib-apidoc)", "python3dist(sphinxcontrib-svg2pdfconverter)"]

# Hagistack's changes to the upstream tree: written into %changelog and
# HAGISTACK-CHANGES (installed in every binary package) by genspec.py.
changelog_date = "Sun Nov 15 2026"
changes = [
  "doc/source/conf.py: the Sphinx extension sphinxcontrib.rsvgconverter is removed from the extension list (it is only for PDF output and not available on the builder). The HTML documentation in python-keystonemiddleware-doc is built from the edited file.",
]
# sphinxcontrib.rsvgconverter is only for PDF output and its module is not in the
# builder repositories; the HTML build does not need it.
prep_extra = ["sed -i \"/'sphinxcontrib.rsvgconverter',/d\" doc/source/conf.py"]
[[package]]
name = "python3-keystonemiddleware"
kind = "python"
modules = ["keystonemiddleware"]
docs = ["README.rst"]
licenses = ["LICENSE"]

[[package]]
name = "python-keystonemiddleware-doc"
kind = "sphinx-html"
summary = "Documentation for keystonemiddleware"
description = """
HTML documentation for keystonemiddleware, built from the upstream sources.
"""
docs = ["LICENSE"]
